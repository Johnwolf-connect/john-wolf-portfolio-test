name: Fix MacBook model scale

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-macbook-model-scale.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct MacBook imported scale
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('public/assets/start-project/start-project-transition-core.js')
          source = path.read_text()

          old = "        model.scale.setScalar(9.48)"
          new = '''        model.scale.setScalar(1)
          model.updateMatrixWorld(true)

          let importedScreenWidth = 0

          if (screenSurface?.geometry) {
            if (!screenSurface.geometry.boundingBox) {
              screenSurface.geometry.computeBoundingBox()
            }

            const screenBounds = screenSurface.geometry.boundingBox
            const screenWorldScale = new THREE.Vector3()
            screenSurface.getWorldScale(screenWorldScale)

            importedScreenWidth =
              (screenBounds.max.x - screenBounds.min.x) *
              Math.abs(screenWorldScale.x)
          }

          const normalizedModelScale =
            importedScreenWidth > 0.0001
              ? screenWidth / importedScreenWidth
              : 948

          model.scale.setScalar(normalizedModelScale)
          model.updateMatrixWorld(true)'''

          if old not in source:
              raise SystemExit('Expected MacBook scale line was not found; refusing to patch.')

          source = source.replace(old, new, 1)

          if 'model.scale.setScalar(9.48)' in source:
              raise SystemExit('Old MacBook scale is still present.')

          if 'importedScreenWidth' not in source:
              raise SystemExit('Bounds-based MacBook normalization was not inserted.')

          path.write_text(source)
          PY

      - name: Verify JavaScript syntax
        run: node --check public/assets/start-project/start-project-transition-core.js

      - name: Verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit corrected model scale
        shell: bash
        run: |
          rm -f .github/workflows/fix-macbook-model-scale.yml
          git config user.name "John Wolf"
          git config user.email "136143744+Johnwolf-connect@users.noreply.github.com"
          git add public/assets/start-project/start-project-transition-core.js .github/workflows/fix-macbook-model-scale.yml
          git commit -m "Fix MacBook model scale normalization"
          git push origin HEAD:main
