name: Apply Apple-style Services redesign v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apple-services-redesign-apply.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Services section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          app_path = Path('src/App.jsx')
          css_path = Path('src/styles.css')
          app = app_path.read_text()
          css = css_path.read_text()
          new_effect = base64.b64decode('').decode()
          css_append = base64.b64decode('').decode()

          start_marker = "  useLayoutEffect(() => {\n    const stage = portfolioStage.current\n\n    if (!stage) return undefined\n"
          end_marker = "\n  useLayoutEffect(() => {\n    const context = gsap.context(() => {"

          start = app.find(start_marker)
          end = app.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Services carousel effect markers not found')

          app = app[:start] + new_effect + app[end:]
          app = app.replace(
              '<span>Drag / swipe · smooth snap</span>',
              '<span>Scroll / drag · snap to explore</span>',
          )

          marker = '/* ===== APPLE SERVICES REDESIGN: START ===== */'
          if marker in css:
              css = css.split(marker)[0].rstrip() + '\n'

          css = css.rstrip() + '\n' + css_append

          app_path.write_text(app)
          css_path.write_text(css)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build verification
        run: npm run build

      - name: Commit redesign
        shell: bash
        run: |
          if git diff --quiet -- src/App.jsx src/styles.css; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "John Wolf"
          git config user.email "136143744+Johnwolf-connect@users.noreply.github.com"
          git add src/App.jsx src/styles.css
          git commit -m "Redesign Services as pinned Apple-style story"
          git push origin HEAD:main
