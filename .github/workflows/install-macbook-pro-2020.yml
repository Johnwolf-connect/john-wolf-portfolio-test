name: Install MacBook Pro 2020

on:
  push:
    paths:
      - '.github/workflows/install-macbook-pro-2020.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download prepared MacBook Pro 2020 assets
        run: |
          curl -fL 'https://at.adobe.com/XdouLx4yd1aYbX3M' -o /tmp/macbook-pro-2020.zip
          rm -rf /tmp/macbook-pro-2020
          mkdir -p /tmp/macbook-pro-2020
          unzip -o /tmp/macbook-pro-2020.zip -d /tmp/macbook-pro-2020
          mkdir -p public/assets/start-project/macbook
          cp /tmp/macbook-pro-2020/Macbook-Pro-2020-web.glb public/assets/start-project/macbook/macbook-pro-2020.glb
          cp /tmp/macbook-pro-2020/keyboard_diff.jpg public/assets/start-project/macbook/keyboard_diff.jpg
          cp /tmp/macbook-pro-2020/touchpad_diff.jpg public/assets/start-project/macbook/touchpad_diff.jpg
          cp /tmp/macbook-pro-2020/apple_logo_diff.jpg public/assets/start-project/macbook/apple_logo_diff.jpg
          cp /tmp/macbook-pro-2020/camera_diff.jpg public/assets/start-project/macbook/camera_diff.jpg
          cp /tmp/macbook-pro-2020/macbook_pro_logo_diff.jpg public/assets/start-project/macbook/macbook_pro_logo_diff.jpg
          cp /tmp/macbook-pro-2020/home_screen_diff.jpg public/assets/start-project/macbook/home_screen_diff.jpg
          cp /tmp/macbook-pro-2020/dots_mask.jpg public/assets/start-project/macbook/dots_mask.jpg
      - name: Wire model, hinge, textures, and live screen
        run: |
          echo '' | base64 -d > /tmp/patch_macbook.py
          python3 /tmp/patch_macbook.py
      - name: Verify exact asset and JavaScript syntax
        run: |
          test -s public/assets/start-project/macbook/macbook-pro-2020.glb
          node --check public/assets/start-project/start-project-transition-core.js
      - name: Verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publish MacBook Pro 2020 integration
        run: |
          rm -f .github/workflows/install-macbook-pro-2020.yml
          rm -f .github/workflows/fit-macbook-real-bounds.yml
          rm -f .github/workflows/inspect-macbook-glb.yml
          rm -f macbook-glb-inspection.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install clean MacBook Pro 2020 transition model'
          git push
