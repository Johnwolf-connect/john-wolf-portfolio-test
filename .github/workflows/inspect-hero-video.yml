name: Inspect hero video

on:
  push:
    paths:
      - '.github/workflows/inspect-hero-video.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Inspect hero MP4
        run: |
          ffprobe -v error -show_streams -show_format -of json public/assets/hero-neon.mp4
          echo "--- packet tail ---"
          ffprobe -v error -select_streams v:0 -show_packets -of compact=p=0:nk=1 public/assets/hero-neon.mp4 | tail -n 20
