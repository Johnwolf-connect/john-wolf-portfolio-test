name: Replace Start Project MacBook with MacBook Air 15

on:
  push:
    paths:
      - '.github/workflows/replace-new-macbook-model.yml'

permissions:
  contents: write

jobs:
  replace-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download exact uploaded MacBook Air GLB
        run: |
          curl -L --fail --retry 3 -o /tmp/apple-macbook-air-15.glb 'https://at.adobe.com/mAJ9WcGeg7mXFeNs'
          test "$(stat -c%s /tmp/apple-macbook-air-15.glb)" = "9614728"
          echo '235295da6eaa81f55d4a7c895c152171a59bcc560c746390a65d8f2e503bf875  /tmp/apple-macbook-air-15.glb' | sha256sum -c -

      - name: Replace model in place
        run: |
          cp /tmp/apple-macbook-air-15.glb public/assets/start-project/macbook/macbook-ultra.glb

      - name: Add closed-to-open lid animation support
        run: |
          echo '' | base64 -d > /tmp/patch_macbook.py
          python /tmp/patch_macbook.py

      - name: Verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit model replacement and cleanup
        run: |
          git config user.name 'John Wolf'
          git config user.email '136143744+Johnwolf-connect@users.noreply.github.com'
          git add public/assets/start-project/macbook/macbook-ultra.glb src/start-project-transition-core.js public/assets/start-project/start-project-transition-core.js
          git commit -m 'Replace Start Project MacBook and animate lid opening'
          git rm -f .github/workflows/replace-new-macbook-model.yml .github/workflows/inspect-new-macbook-source.yml
          git commit -m 'Clean MacBook replacement workflows'
          git push origin main
