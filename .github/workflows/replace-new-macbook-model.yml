name: Replace Start Project MacBook with MacBook Air 15

on:
  push:
    paths:
      - '.github/workflows/replace-new-macbook-model.yml'

permissions:
  contents: write

jobs:
  replace-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download exact uploaded MacBook Air GLB
        run: |
          curl -L --fail --retry 3 -o /tmp/apple-macbook-air-15.glb 'https://at.adobe.com/mAJ9WcGeg7mXFeNs'
          test "$(stat -c%s /tmp/apple-macbook-air-15.glb)" = "9614728"
          echo '235295da6eaa81f55d4a7c895c152171a59bcc560c746390a65d8f2e503bf875  /tmp/apple-macbook-air-15.glb' | sha256sum -c -

      - name: Verify new model structure
        run: |
          python - <<'PY'
          import json, struct
          path='/tmp/apple-macbook-air-15.glb'
          with open(path,'rb') as f:
              assert f.read(4) == b'glTF'
              version=struct.unpack('<I',f.read(4))[0]
              assert version == 2
              f.read(4)
              json_len=struct.unpack('<I',f.read(4))[0]
              assert f.read(4) == b'JSON'
              data=json.loads(f.read(json_len).decode('utf-8'))
          names={node.get('name') for node in data.get('nodes',[])}
          materials={m.get('name') for m in data.get('materials',[])}
          assert 'GyAtsALzJhKEkPM' in names, 'lid assembly missing'
          assert 'SadnAkehSlxIwKv' in names, 'screen surface missing'
          assert 'VNZklasZKSWjWUk' in materials, 'screen material missing'
          extras=data.get('asset',{}).get('extras',{})
          assert extras.get('title') == 'Apple Macbook Air 15 (Space Gray) 2023'
          print('Verified exact MacBook Air 15 model and hinge/screen nodes')
          PY

      - name: Replace model in place
        run: |
          cp /tmp/apple-macbook-air-15.glb public/assets/start-project/macbook/macbook-ultra.glb

      - name: Add closed-to-open lid animation support
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path=Path('src/start-project-transition-core.js')
          code=path.read_text()

          old="""  let screenSurface = null
  const loader = new GLTFLoader()
"""
          new="""  let screenSurface = null
  let screenLocalCorners = null
  let lidPivot = null
  let lidOpenProgress = 0
  const CLOSED_LID_ANGLE = THREE.MathUtils.degToRad(110.05)
  const loader = new GLTFLoader()
"""
          assert old in code, 'screen state anchor missing'
          code=code.replace(old,new,1)

          old="""          const isWallpaperSurface = materials.some(
            (material) => material?.name === 'LCD',
          )
"""
          new="""          const isWallpaperSurface =
            child.name === 'SadnAkehSlxIwKv' ||
            materials.some(
              (material) =>
                material?.name === 'LCD' ||
                material?.name === 'VNZklasZKSWjWUk',
            )
"""
          assert old in code, 'wallpaper detector anchor missing'
          code=code.replace(old,new,1)

          pattern=re.compile(r"        /\*\n          The uploaded MacBook Ultra model is authored in meters\.[\s\S]*?        model\.position\.set\(0, -111, 110\.5\)\n")
          replacement="""        /*
          MacBook Air 15 (Space Gray) 2023. The source model is authored
          open. Re-parent the complete lid assembly to a hinge pivot so the
          transition can begin physically closed and open during the turn.
        */
        const lidAssembly = model.getObjectByName('GyAtsALzJhKEkPM')

        if (lidAssembly?.parent) {
          const lidParent = lidAssembly.parent
          lidPivot = new THREE.Group()
          lidPivot.name = 'JohnWolfMacBookLidPivot'
          lidPivot.position.set(0, -0.25, -11.75)
          lidParent.add(lidPivot)
          lidParent.updateMatrixWorld(true)
          lidPivot.updateMatrixWorld(true)
          lidPivot.attach(lidAssembly)
          lidPivot.rotation.x = CLOSED_LID_ANGLE
          lidOpenProgress = 0
        }

        if (screenSurface) {
          screenLocalCorners = [
            new THREE.Vector3(-16.2, 20.15, -19.48),
            new THREE.Vector3(16.2, 20.15, -19.48),
            new THREE.Vector3(16.2, 1.3, -12.59),
            new THREE.Vector3(-16.2, 1.3, -12.59),
          ]
        }

        /*
          Scale the 34 cm wide MacBook so its LCD is the same 310-unit
          transition surface used by the existing camera choreography, then
          center that LCD around the transition origin.
        */
        model.scale.setScalar(9.48)
        model.position.set(0, -101.7, 152)
"""
          code,count=pattern.subn(replacement,code,count=1)
          assert count==1, 'old MacBook scale block missing'

          old="""    const geometry = screenSurface.geometry
"""
          new="""    if (screenLocalCorners) {
      return screenLocalCorners.map((corner) =>
        screenSurface.localToWorld(corner.clone()),
      )
    }

    const geometry = screenSurface.geometry
"""
          assert old in code, 'screen corner anchor missing'
          code=code.replace(old,new,1)

          old="""    livePage.screen.style.opacity = area > 1 ? '1' : '0'
"""
          new="""    const screenReveal = clamp((lidOpenProgress - 0.12) / 0.24, 0, 1)
    livePage.screen.style.opacity =
      area > 1 ? String(screenReveal) : '0'
"""
          assert old in code, 'screen opacity anchor missing'
          code=code.replace(old,new,1)

          old="""    laptopRoot.rotation.z =
      Math.sin(travelPhase * Math.PI * 2) * 0.055 +
      mix(0, -0.018, travelEase)

    if (progress > 0.08 && livePage) {
"""
          new="""    laptopRoot.rotation.z =
      Math.sin(travelPhase * Math.PI * 2) * 0.055 +
      mix(0, -0.018, travelEase)

    const lidPhase = clamp((progress - 0.08) / 0.64, 0, 1)
    lidOpenProgress = easeInOutCubic(lidPhase)

    if (lidPivot) {
      lidPivot.rotation.x = mix(
        CLOSED_LID_ANGLE,
        0,
        lidOpenProgress,
      )
    }

    if (progress > 0.08 && livePage) {
"""
          assert old in code, 'opening pose anchor missing'
          code=code.replace(old,new,1)

          old="""    laptopRoot.rotation.set(
      -0.075 + drift * 0.006,
      Math.PI * 2 - 0.2 + hover * 0.008,
      -0.018 + drift * 0.009,
    )
  }
"""
          new="""    laptopRoot.rotation.set(
      -0.075 + drift * 0.006,
      Math.PI * 2 - 0.2 + hover * 0.008,
      -0.018 + drift * 0.009,
    )

    lidOpenProgress = 1
    if (lidPivot) lidPivot.rotation.x = 0
  }
"""
          assert old in code, 'settled pose anchor missing'
          code=code.replace(old,new,1)

          old="""    laptopRoot.scale.setScalar(layout.initialScale)

    cancelAnimationFrame(animationFrame)
"""
          new="""    laptopRoot.scale.setScalar(layout.initialScale)
    lidOpenProgress = 0
    if (lidPivot) lidPivot.rotation.x = CLOSED_LID_ANGLE

    cancelAnimationFrame(animationFrame)
"""
          assert old in code, 'open reset anchor missing'
          code=code.replace(old,new,1)

          old="""    const startRotation = laptopRoot.rotation.clone()

    await animate(1680, (progress) => {
"""
          new="""    const startRotation = laptopRoot.rotation.clone()
    const startLidRotation = lidPivot?.rotation.x ?? 0

    await animate(1680, (progress) => {
"""
          assert old in code, 'close transition anchor missing'
          code=code.replace(old,new,1)

          old="""      if (progress > 0.38) stage.classList.remove('is-rock-visible')
"""
          new="""      lidOpenProgress = 1 - eased
      if (lidPivot) {
        lidPivot.rotation.x = mix(
          startLidRotation,
          CLOSED_LID_ANGLE,
          eased,
        )
      }

      if (progress > 0.38) stage.classList.remove('is-rock-visible')
"""
          assert old in code, 'close lid anchor missing'
          code=code.replace(old,new,1)

          old="""    laptopRoot.scale.setScalar(layout.initialScale)
    projectLivePage()
"""
          new="""    laptopRoot.scale.setScalar(layout.initialScale)
    lidOpenProgress = 0
    if (lidPivot) lidPivot.rotation.x = CLOSED_LID_ANGLE
    projectLivePage()
"""
          assert old in code, 'close reset anchor missing'
          code=code.replace(old,new,1)

          path.write_text(code)
          Path('public/assets/start-project/start-project-transition-core.js').write_text(code)

          assert "CLOSED_LID_ANGLE" in code
          assert "GyAtsALzJhKEkPM" in code
          assert "VNZklasZKSWjWUk" in code
          assert "model.scale.setScalar(9.48)" in code
          print('MacBook Air hinge animation patched')
          PY

      - name: Verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit exact model replacement and clean staging workflows
        run: |
          git config user.name 'John Wolf'
          git config user.email '136143744+Johnwolf-connect@users.noreply.github.com'
          git add public/assets/start-project/macbook/macbook-ultra.glb src/start-project-transition-core.js public/assets/start-project/start-project-transition-core.js
          git commit -m 'Replace Start Project MacBook and animate lid opening'
          git rm -f .github/workflows/replace-new-macbook-model.yml .github/workflows/inspect-new-macbook-source.yml
          git commit -m 'Clean MacBook replacement workflows'
          git push origin main
