name: Fix Services card interaction layer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-services-card-clicks.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep drag proxy behind clickable cards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/styles.css')
          css = path.read_text()
          marker = '/* ===== SERVICES CLICK LAYER FIX ===== */'
          if marker in css:
              css = css.split(marker)[0].rstrip() + '\n'
          css += '''\n\n/* ===== SERVICES CLICK LAYER FIX ===== */\n.archive-drag-proxy {\n  inset: auto;\n  top: 0;\n  left: 0;\n  width: 1px;\n  height: 1px;\n  opacity: 0;\n  pointer-events: none;\n}\n\n.archive-seamless-stage {\n  cursor: grab;\n}\n\n.archive-seamless-stage.is-dragging {\n  cursor: grabbing;\n}\n'''
          path.write_text(css)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build verification
        run: npm run build

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "John Wolf"
          git config user.email "136143744+Johnwolf-connect@users.noreply.github.com"
          git add src/styles.css
          git commit -m "Keep redesigned Services cards clickable"
          git push origin HEAD:main
