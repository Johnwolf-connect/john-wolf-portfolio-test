name: Apply Start a Project scroll trigger v2

on:
  push:
    paths:
      - '.github/workflows/add-start-project-scroll-trigger-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch Start a Project trigger
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/App.jsx')
          app = path.read_text()

          if "const [contactOpen, setContactOpen]" not in app:
              anchor = "  const [brandProjectIndex, setBrandProjectIndex] = useState(0)\n"
              if anchor not in app:
                  raise SystemExit('state anchor missing')
              app = app.replace(
                  anchor,
                  anchor
                  + "  const [contactOpen, setContactOpen] = useState(false)\n"
                  + "  const contactReturnY = useRef(0)\n"
                  + "  const contactReturnNavigation = useRef('About')\n",
                  1,
              )

          if "const showContactExperience" not in app:
              pattern = re.compile(
                  r"  const navigateToSection = \(\s*item,\s*closeBrandPage = false,\s*\) => \{\s*const target = navigationTargets\[item\]\s*if \(!target\) return",
                  re.S,
              )
              replacement = """  const navigateToSection = (
            item,
            closeBrandPage = false,
          ) => {
            if (item === 'Contact') {
              setMenuOpen(false)
              contactReturnY.current = window.scrollY
              contactReturnNavigation.current = activeNavigation

              const showContactExperience = () => {
                setActiveNavigation('Contact')
                setContactOpen(true)
              }

              if (
                closeBrandPage &&
                (brandPageOpen || websitesPageOpen || froidPageOpen)
              ) {
                setBrandPageOpen(false)
                setWebsitesPageOpen(false)
                setFroidPageOpen(false)
                window.requestAnimationFrame(() => {
                  window.requestAnimationFrame(showContactExperience)
                })
                return
              }

              showContactExperience()
              return
            }

            const target = navigationTargets[item]

            if (!target) return"""
              app, count = pattern.subn(replacement, app, count=1)
              if count != 1:
                  raise SystemExit('navigation anchor missing')

          if "const openFromAboutEnd" not in app:
              effect_pattern = re.compile(
                  r"  useEffect\(\(\) => \{\s*if \(!brandPageOpen\) return undefined\s*const oldHtmlOverflow\s*=",
                  re.S,
              )
              match = effect_pattern.search(app)
              if not match:
                  raise SystemExit('top-level effect anchor missing')

              effects = """  useEffect(() => {
            if (!contactOpen) return undefined

            const previousHtmlOverflow =
              document.documentElement.style.overflow
            const previousBodyOverflow =
              document.body.style.overflow

            document.documentElement.style.overflow = 'hidden'
            document.body.style.overflow = 'hidden'

            const overlay = document.querySelector(
              '.contact-experience',
            )

            if (overlay) {
              gsap.fromTo(
                overlay,
                {
                  opacity: 0,
                  y: 34,
                  scale: 0.985,
                  filter: 'blur(8px)',
                },
                {
                  opacity: 1,
                  y: 0,
                  scale: 1,
                  filter: 'blur(0px)',
                  duration: 0.72,
                  ease: 'power3.out',
                },
              )
            }

            const closeContactExperience = () => {
              setContactOpen(false)
              setActiveNavigation(
                contactReturnNavigation.current,
              )

              window.requestAnimationFrame(() => {
                window.scrollTo({
                  top: contactReturnY.current,
                  behavior: 'auto',
                })
              })
            }

            const handleContactEscape = (event) => {
              if (event.key === 'Escape') {
                closeContactExperience()
              }
            }

            window.addEventListener(
              'keydown',
              handleContactEscape,
            )

            return () => {
              window.removeEventListener(
                'keydown',
                handleContactEscape,
              )
              document.documentElement.style.overflow =
                previousHtmlOverflow
              document.body.style.overflow =
                previousBodyOverflow
            }
          }, [contactOpen])

          useEffect(() => {
            let touchStartY = null
            let triggerLocked = false

            const isAtAboutEnd = () => {
              const about = document.querySelector('#about')
              if (!about) return false

              const rect = about.getBoundingClientRect()
              const atDocumentEnd =
                window.scrollY + window.innerHeight >=
                document.documentElement.scrollHeight - 4

              return (
                atDocumentEnd &&
                rect.bottom <= window.innerHeight + 6
              )
            }

            const openFromAboutEnd = () => {
              if (
                triggerLocked ||
                contactOpen ||
                brandPageOpen ||
                websitesPageOpen ||
                froidPageOpen ||
                !isAtAboutEnd()
              ) {
                return
              }

              triggerLocked = true
              contactReturnY.current = window.scrollY
              contactReturnNavigation.current = 'About'
              setActiveNavigation('Contact')
              setContactOpen(true)

              window.setTimeout(() => {
                triggerLocked = false
              }, 650)
            }

            const handleWheel = (event) => {
              if (event.deltaY > 12) openFromAboutEnd()
            }

            const handleTouchStart = (event) => {
              touchStartY = event.touches?.[0]?.clientY ?? null
            }

            const handleTouchEnd = (event) => {
              const endY = event.changedTouches?.[0]?.clientY
              if (
                touchStartY !== null &&
                Number.isFinite(endY) &&
                touchStartY - endY > 34
              ) {
                openFromAboutEnd()
              }
              touchStartY = null
            }

            const handleEndKey = (event) => {
              if (
                event.key === 'ArrowDown' ||
                event.key === 'PageDown' ||
                event.key === ' '
              ) {
                openFromAboutEnd()
              }
            }

            window.addEventListener('wheel', handleWheel, { passive: true })
            window.addEventListener('touchstart', handleTouchStart, { passive: true })
            window.addEventListener('touchend', handleTouchEnd, { passive: true })
            window.addEventListener('keydown', handleEndKey)

            return () => {
              window.removeEventListener('wheel', handleWheel)
              window.removeEventListener('touchstart', handleTouchStart)
              window.removeEventListener('touchend', handleTouchEnd)
              window.removeEventListener('keydown', handleEndKey)
            }
          }, [
            contactOpen,
            brandPageOpen,
            websitesPageOpen,
            froidPageOpen,
          ])

          """
              app = app[:match.start()] + effects + app[match.start():]

          if 'className="contact-experience chapter-page"' not in app:
              pattern = re.compile(
                  r'\s*<section className="chapter-page full-page-section" id="contact">.*?</section>',
                  re.S,
              )
              replacement = """
              {contactOpen && (
                <div
                  className=\"contact-experience chapter-page\"
                  id=\"contact\"
                  role=\"dialog\"
                  aria-modal=\"true\"
                  aria-labelledby=\"contact-experience-title\"
                  style={{
                    position: 'fixed',
                    inset: 0,
                    zIndex: 11000,
                    minHeight: '100svh',
                  }}
                >
                  <button
                    className=\"header-cta\"
                    type=\"button\"
                    aria-label=\"Close Start a Project\"
                    style={{
                      position: 'absolute',
                      top: '1.5rem',
                      right: 'var(--page-gutter)',
                      zIndex: 2,
                    }}
                    onClick={() => {
                      setContactOpen(false)
                      setActiveNavigation(
                        contactReturnNavigation.current,
                      )
                      window.requestAnimationFrame(() => {
                        window.scrollTo({
                          top: contactReturnY.current,
                          behavior: 'auto',
                        })
                      })
                    }}
                  >
                    Close <span aria-hidden=\"true\">×</span>
                  </button>

                  <div className=\"chapter-page-copy\">
                    <p>Contact</p>
                    <h2 id=\"contact-experience-title\">
                      Start something.
                    </h2>
                    <span>
                      A full-screen closing chapter built around the next project.
                    </span>
                  </div>
                </div>
              )}
              """
              app, count = pattern.subn(replacement, app, count=1)
              if count != 1:
                  raise SystemExit('Contact section missing')

          path.write_text(app)

          assert "const [contactOpen, setContactOpen] = useState(false)" in app
          assert "const openFromAboutEnd" in app
          assert 'className="contact-experience chapter-page"' in app
          assert '<section className="chapter-page full-page-section" id="contact">' not in app
          assert "if (item === 'Contact')" in app
          print('Start a Project scroll trigger ready')
          PY

      - name: Verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish and clean updater
        run: |
          git config user.name 'John Wolf'
          git config user.email '136143744+Johnwolf-connect@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'Trigger Start a Project after About scroll'
          git rm -f .github/workflows/add-start-project-scroll-trigger.yml .github/workflows/add-start-project-scroll-trigger-v2.yml
          git commit -m 'Clean Start a Project updater'
          git push origin main