name: Validate hero media streams

on:
  push:
    paths:
      - '.github/workflows/validate-hero-streams.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate complete MP4
        run: |
          set +e
          ffmpeg -v error -xerror \
            -i public/assets/hero-neon.mp4 \
            -f null - > /tmp/full-decode.log 2>&1
          status=$?
          set -e

          echo "FULL_DECODE_STATUS=$status"
          cat /tmp/full-decode.log

          if [ "$status" -ne 0 ]; then
            echo "Full stream decode failed. Rebuilding video-only MP4."
            ffmpeg -y \
              -i public/assets/hero-neon.mp4 \
              -map 0:v:0 \
              -c:v copy \
              -an \
              -movflags +faststart \
              /tmp/hero-neon-video-only.mp4

            ffmpeg -v error -xerror \
              -i /tmp/hero-neon-video-only.mp4 \
              -f null -

            mv /tmp/hero-neon-video-only.mp4 \
              public/assets/hero-neon.mp4

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/assets/hero-neon.mp4
            git commit -m 'Remove faulty audio stream from hero background video'
            git push
          fi
