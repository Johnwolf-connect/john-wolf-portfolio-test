name: Install M5 Model
on:
  push:
    paths:
      - '.github/workflows/install-m5-model.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download supplied M5 model
        run: |
          curl -L --fail --retry 2 -o /tmp/m5.zip 'https://at.adobe.com/2sxo43aY7yXbCWgP'
          unzip -q /tmp/m5.zip -d /tmp/m5
          mkdir -p public/assets/start-project/macbook-m5
          cp '/tmp/m5/macbook-pro-14-inch-m5/source/macbook_pro_14_inch_M5.glb' public/assets/start-project/macbook-m5/macbook-pro-14-m5.glb
          cp '/tmp/m5/macbook-pro-14-inch-m5/textures/Screen.png' public/assets/start-project/macbook-m5/Screen.png
      - name: Commit model assets
        run: |
          git config user.name 'John Wolf'
          git config user.email '136143744+Johnwolf-connect@users.noreply.github.com'
          git add public/assets/start-project/macbook-m5
          git commit -m 'Install MacBook Pro 14-inch M5 model assets'
          git push
