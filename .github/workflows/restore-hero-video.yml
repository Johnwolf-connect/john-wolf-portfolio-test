name: Restore healthy hero video

on:
  push:
    paths:
      - '.github/workflows/restore-hero-video.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Find last healthy hero video
        run: |
          set -e
          target='public/assets/hero-neon.mp4'
          commits=(
            6f3a67d4a1bea9145f211c0cf630799855f0b582
            479a63e9184dc26a695fbe836986a584e9887357
            88f1157b4ca25760b30936cbcedc3d5f9211bb8c
          )

          chosen=''
          for commit in "${commits[@]}"; do
            echo "Testing $commit"
            if git show "$commit:$target" > /tmp/hero-candidate.mp4 2>/dev/null; then
              duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/hero-candidate.mp4 || true)"
              echo "Duration: $duration"
              if awk "BEGIN {exit !($duration > 10)}"; then
                if ffmpeg -v error -xerror -i /tmp/hero-candidate.mp4 -map 0:v:0 -f null - >/tmp/decode.log 2>&1; then
                  chosen="$commit"
                  cp /tmp/hero-candidate.mp4 "$target"
                  echo "Healthy source found: $commit"
                  break
                else
                  echo "Decode failed for $commit"
                  cat /tmp/decode.log
                fi
              fi
            fi
          done

          test -n "$chosen"
          echo "RESTORED_FROM=$chosen" >> "$GITHUB_ENV"

          ffprobe -v error \
            -show_entries stream=codec_name,pix_fmt,r_frame_rate,duration \
            -show_entries format=duration,start_time,size \
            -of default=noprint_wrappers=1 "$target"

      - name: Commit restored binary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/hero-neon.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Restore healthy hero video binary"
          git push
