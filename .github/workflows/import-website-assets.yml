name: Import website page assets

on:
  push:
    paths:
      - '.github/workflows/import-website-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download approved website assets
        run: |
          mkdir -p public/assets/websites
          curl -L --fail --retry 3 -o public/assets/websites/froid-cover.png 'https://at.adobe.com/jTSLybLAKy3gjXwY'
          curl -L --fail --retry 3 -o public/assets/websites/atlanta-background.png 'https://at.adobe.com/1aFhN861M1ZS1Usg'

      - name: Commit imported assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/websites/froid-cover.png public/assets/websites/atlanta-background.png
          if git diff --cached --quiet; then
            echo 'Assets already current.'
          else
            git commit -m 'Add Froid cover and Atlanta website background'
            git push
          fi
