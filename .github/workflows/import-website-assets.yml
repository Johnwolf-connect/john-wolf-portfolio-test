name: Import website page assets

on:
  push:
    paths:
      - '.github/workflows/import-website-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Froid cover
        run: |
          mkdir -p public/assets/websites
          curl -L --fail --retry 3 -o public/assets/websites/froid-cover.png 'https://at.adobe.com/6nJEwyk1nTG1V8qK'

      - name: Commit imported Froid cover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/websites/froid-cover.png
          if git diff --cached --quiet; then
            echo 'Froid cover already current.'
          else
            git commit -m 'Update Froid portfolio cover'
            git push
          fi
