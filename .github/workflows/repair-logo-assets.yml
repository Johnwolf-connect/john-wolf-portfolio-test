name: Repair logo card assets

on:
  push:
    paths:
      - '.github/workflows/repair-logo-assets.yml'

permissions:
  contents: write

jobs:
  repair-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download verified replacement bundle
        run: |
          curl -L --fail --retry 3 -o /tmp/logo-assets.zip 'https://at.adobe.com/46j85BmCcnfDKCQ8'
          rm -rf /tmp/logo-assets
          mkdir -p /tmp/logo-assets
          unzip -q /tmp/logo-assets.zip -d /tmp/logo-assets

      - name: Replace only damaged logo cards in place
        run: |
          target='public/assets/ring-lab/logo-cards-clean'
          files=(
            logo-card-01.png
            logo-card-02.png
            logo-card-03.png
            logo-card-06.png
            logo-card-07.png
            logo-card-08.png
            logo-card-09.png
            logo-card-10.png
            logo-card-12.png
            logo-card-13.png
            logo-card-14.png
            logo-card-15.png
            logo-card-17.png
            logo-card-18.png
            logo-card-19.png
            logo-card-20.png
            logo-card-21.png
            logo-card-22.png
            logo-card-23.png
            logo-card-25.png
            logo-card-26.png
            logo-card-27.png
            logo-card-28.png
            logo-card-29.png
          )
          for f in "${files[@]}"; do
            test -s "/tmp/logo-assets/$f"
            cp "/tmp/logo-assets/$f" "$target/$f"
          done

      - name: Commit repaired binaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/ring-lab/logo-cards-clean/logo-card-01.png                   public/assets/ring-lab/logo-cards-clean/logo-card-02.png                   public/assets/ring-lab/logo-cards-clean/logo-card-03.png                   public/assets/ring-lab/logo-cards-clean/logo-card-06.png                   public/assets/ring-lab/logo-cards-clean/logo-card-07.png                   public/assets/ring-lab/logo-cards-clean/logo-card-08.png                   public/assets/ring-lab/logo-cards-clean/logo-card-09.png                   public/assets/ring-lab/logo-cards-clean/logo-card-10.png                   public/assets/ring-lab/logo-cards-clean/logo-card-12.png                   public/assets/ring-lab/logo-cards-clean/logo-card-13.png                   public/assets/ring-lab/logo-cards-clean/logo-card-14.png                   public/assets/ring-lab/logo-cards-clean/logo-card-15.png                   public/assets/ring-lab/logo-cards-clean/logo-card-17.png                   public/assets/ring-lab/logo-cards-clean/logo-card-18.png                   public/assets/ring-lab/logo-cards-clean/logo-card-19.png                   public/assets/ring-lab/logo-cards-clean/logo-card-20.png                   public/assets/ring-lab/logo-cards-clean/logo-card-21.png                   public/assets/ring-lab/logo-cards-clean/logo-card-22.png                   public/assets/ring-lab/logo-cards-clean/logo-card-23.png                   public/assets/ring-lab/logo-cards-clean/logo-card-25.png                   public/assets/ring-lab/logo-cards-clean/logo-card-26.png                   public/assets/ring-lab/logo-cards-clean/logo-card-27.png                   public/assets/ring-lab/logo-cards-clean/logo-card-28.png                   public/assets/ring-lab/logo-cards-clean/logo-card-29.png
          git diff --cached --quiet && exit 0
          git commit -m 'Repair damaged logo card image assets'
          git push
