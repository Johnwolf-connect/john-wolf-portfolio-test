name: Tune Services card entry

on:
  push:
    paths:
      - '.github/workflows/tune-services-card-entry.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Adjust Services card size and start position
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/styles.css')
          css = path.read_text()
          marker = '/* ===== SERVICES CARD SIZE / ENTRY POSITION ===== */'

          block = r'''

          /* ===== SERVICES CARD SIZE / ENTRY POSITION ===== */
          @media (min-width: 821px) {
            .portfolio-page .archive-seamless-card {
              left: 54%;
              width: clamp(215px, 22vw, 325px);
            }
          }
          /* ===== SERVICES CARD SIZE / ENTRY POSITION: END ===== */
          '''

          if marker in css:
              start = css.index(marker)
              end_marker = '/* ===== SERVICES CARD SIZE / ENTRY POSITION: END ===== */'
              end = css.index(end_marker, start) + len(end_marker)
              css = css[:start] + block.strip() + css[end:]
          else:
              css += block

          path.write_text(css)
          assert 'left: 54%;' in css
          assert 'width: clamp(215px, 22vw, 325px);' in css
          print('Services card entry tuned')
          PY

      - name: Verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish and clean updater
        run: |
          git config user.name 'John Wolf'
          git config user.email '136143744+Johnwolf-connect@users.noreply.github.com'
          git add src/styles.css
          git commit -m 'Refine Services card size and entry point'
          git rm .github/workflows/tune-services-card-entry.yml
          git commit -m 'Clean Services card tuner'
          git push origin main
