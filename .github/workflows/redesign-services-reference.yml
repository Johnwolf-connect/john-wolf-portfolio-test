name: Redesign Services to reference

on:
  push:
    paths:
      - '.github/workflows/redesign-services-reference.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply Services reference redesign
        run: python3 scripts/redesign_services_reference.py

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Publish and clean updater
        run: |
          rm -f .github/workflows/redesign-services-reference.yml scripts/redesign_services_reference.py
          git config user.name "John Wolf"
          git config user.email "136143744+Johnwolf-connect@users.noreply.github.com"
          git add src/App.jsx src/styles.css .github/workflows/redesign-services-reference.yml scripts/redesign_services_reference.py
          git commit -m "Redesign Services section to reference layout"
          git push
