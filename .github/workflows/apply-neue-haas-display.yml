name: Apply Neue Haas display font

on:
  push:
    paths:
      - '.github/workflows/apply-neue-haas-display.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild font asset
        run: |
          mkdir -p public/assets/fonts
          cat \
            .font-staging/black-gz-part-00 \
            .font-staging/black-gz-part-01 \
            .font-staging/black-gz-part-02 \
            .font-staging/black-gz-part-03 \
            .font-staging/black-gz-part-04 \
            > /tmp/neue-haas-black.gz.b64
          base64 --decode /tmp/neue-haas-black.gz.b64 > /tmp/neue-haas-black.otf.gz
          echo '70f3cb4a19c68b3a9b6805e66acf24151a13972af5e1f2640f16626bc9859946  /tmp/neue-haas-black.otf.gz' | sha256sum -c -
          gzip -dc /tmp/neue-haas-black.otf.gz > public/assets/fonts/NeueHaasGrotDispRound-95Black.otf
          echo '805aa397dd5f689badf4cbeec02392012f1468ddd166fefa0a1f2e1166f8bbba  public/assets/fonts/NeueHaasGrotDispRound-95Black.otf' | sha256sum -c -

      - name: Apply display heading typography
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/styles.css')
          css = path.read_text()
          marker = '/* ===== NEUE HAAS DISPLAY HEADINGS: START ===== */'
          if marker not in css:
              css += r'''

/* ===== NEUE HAAS DISPLAY HEADINGS: START ===== */
@font-face {
  font-family: 'Neue Haas Grotesk Display Round';
  src: url('/assets/fonts/NeueHaasGrotDispRound-95Black.otf') format('opentype');
  font-style: normal;
  font-weight: 900;
  font-display: swap;
}

.hero-copy h1,
.carousel-heading h2,
.specialties-heading h2,
.chapter-page-copy h2,
.brand-page-copy > h2,
.brand-page-interface > h2,
.websites-hero-copy h1 {
  font-family: 'Neue Haas Grotesk Display Round', Inter, ui-sans-serif, system-ui, sans-serif;
  font-weight: 900;
}
/* ===== NEUE HAAS DISPLAY HEADINGS: END ===== */
'''
              path.write_text(css)
          PY

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Publish and clean staging
        run: |
          rm -f \
            .font-staging/black-gz-part-00 \
            .font-staging/black-gz-part-01 \
            .font-staging/black-gz-part-02 \
            .font-staging/black-gz-part-03 \
            .font-staging/black-gz-part-04 \
            .github/workflows/apply-neue-haas-display.yml
          rmdir .font-staging 2>/dev/null || true
          git config user.name 'John Wolf'
          git config user.email '136143744+Johnwolf-connect@users.noreply.github.com'
          git add src/styles.css public/assets/fonts/NeueHaasGrotDispRound-95Black.otf .font-staging .github/workflows/apply-neue-haas-display.yml
          git commit -m 'Apply Neue Haas display font to section headings'
          git push
