name: Add Start a Project scroll trigger

on:
  push:
    paths:
      - '.github/workflows/add-start-project-scroll-trigger.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Convert Contact into scroll-triggered overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('src/App.jsx')
          css_path = Path('src/styles.css')
          app = app_path.read_text()
          css = css_path.read_text()

          if "const [contactOpen, setContactOpen]" not in app:
              anchor = "  const [brandProjectIndex, setBrandProjectIndex] = useState(0)\n"
              if anchor not in app:
                  raise SystemExit('contact state anchor not found')
              app = app.replace(
                  anchor,
                  anchor
                  + "  const [contactOpen, setContactOpen] = useState(false)\n"
                  + "  const contactReturnY = useRef(0)\n"
                  + "  const contactReturnNavigation = useRef('About')\n",
                  1,
              )

          if "const showContactExperience" not in app:
              nav_pattern = re.compile(
                  r"  const navigateToSection = \(\s*item,\s*closeBrandPage = false,\s*\) => \{\s*const target = navigationTargets\[item\]\s*if \(!target\) return",
                  re.S,
              )
              nav_replacement = """  const navigateToSection = (
            item,
            closeBrandPage = false,
          ) => {
            if (item === 'Contact') {
              setMenuOpen(false)
              contactReturnY.current = window.scrollY
              contactReturnNavigation.current = activeNavigation

              const showContactExperience = () => {
                setActiveNavigation('Contact')
                setContactOpen(true)
              }

              if (
                closeBrandPage &&
                (brandPageOpen ||
                  websitesPageOpen ||
                  froidPageOpen)
              ) {
                setBrandPageOpen(false)
                setWebsitesPageOpen(false)
                setFroidPageOpen(false)

                window.requestAnimationFrame(() => {
                  window.requestAnimationFrame(
                    showContactExperience,
                  )
                })

                return
              }

              showContactExperience()
              return
            }

            const target = navigationTargets[item]

            if (!target) return"""
              app, count = nav_pattern.subn(
                  nav_replacement,
                  app,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('navigateToSection anchor not found')

          if "const openFromAboutEnd" not in app:
              effect_anchor = "  useEffect(() => {\n    const handleEscape = (event) => {"
              if effect_anchor not in app:
                  raise SystemExit('scroll effect anchor not found')

              contact_effects = """  useEffect(() => {
            if (!contactOpen) return undefined

            const previousHtmlOverflow =
              document.documentElement.style.overflow
            const previousBodyOverflow =
              document.body.style.overflow

            const closeContactExperience = () => {
              setContactOpen(false)
              setActiveNavigation(
                contactReturnNavigation.current,
              )

              window.requestAnimationFrame(() => {
                window.scrollTo({
                  top: contactReturnY.current,
                  behavior: 'auto',
                })
              })
            }

            const handleContactEscape = (event) => {
              if (event.key === 'Escape') {
                closeContactExperience()
              }
            }

            document.documentElement.style.overflow = 'hidden'
            document.body.style.overflow = 'hidden'
            window.addEventListener(
              'keydown',
              handleContactEscape,
            )

            return () => {
              document.documentElement.style.overflow =
                previousHtmlOverflow
              document.body.style.overflow =
                previousBodyOverflow
              window.removeEventListener(
                'keydown',
                handleContactEscape,
              )
            }
          }, [contactOpen])

          useEffect(() => {
            let touchStartY = null
            let triggerLocked = false

            const isAtAboutEnd = () => {
              const about =
                document.querySelector('#about')

              if (!about) return false

              const aboutRect =
                about.getBoundingClientRect()

              const atDocumentEnd =
                window.scrollY +
                  window.innerHeight >=
                document.documentElement.scrollHeight - 4

              return (
                atDocumentEnd &&
                aboutRect.bottom <=
                  window.innerHeight + 6
              )
            }

            const openFromAboutEnd = () => {
              if (
                triggerLocked ||
                contactOpen ||
                brandPageOpen ||
                websitesPageOpen ||
                froidPageOpen ||
                !isAtAboutEnd()
              ) {
                return
              }

              triggerLocked = true
              contactReturnY.current = window.scrollY
              contactReturnNavigation.current = 'About'
              setActiveNavigation('Contact')
              setContactOpen(true)

              window.setTimeout(() => {
                triggerLocked = false
              }, 650)
            }

            const handleWheel = (event) => {
              if (event.deltaY > 12) {
                openFromAboutEnd()
              }
            }

            const handleTouchStart = (event) => {
              touchStartY =
                event.touches?.[0]?.clientY ?? null
            }

            const handleTouchEnd = (event) => {
              const endY =
                event.changedTouches?.[0]?.clientY

              if (
                touchStartY !== null &&
                Number.isFinite(endY) &&
                touchStartY - endY > 34
              ) {
                openFromAboutEnd()
              }

              touchStartY = null
            }

            const handleEndKey = (event) => {
              if (
                event.key === 'ArrowDown' ||
                event.key === 'PageDown' ||
                event.key === ' '
              ) {
                openFromAboutEnd()
              }
            }

            window.addEventListener(
              'wheel',
              handleWheel,
              { passive: true },
            )
            window.addEventListener(
              'touchstart',
              handleTouchStart,
              { passive: true },
            )
            window.addEventListener(
              'touchend',
              handleTouchEnd,
              { passive: true },
            )
            window.addEventListener(
              'keydown',
              handleEndKey,
            )

            return () => {
              window.removeEventListener(
                'wheel',
                handleWheel,
              )
              window.removeEventListener(
                'touchstart',
                handleTouchStart,
              )
              window.removeEventListener(
                'touchend',
                handleTouchEnd,
              )
              window.removeEventListener(
                'keydown',
                handleEndKey,
              )
            }
          }, [
            contactOpen,
            brandPageOpen,
            websitesPageOpen,
            froidPageOpen,
          ])

          """
              app = app.replace(
                  effect_anchor,
                  contact_effects + effect_anchor,
                  1,
              )

          if 'className="contact-experience"' not in app:
              contact_pattern = re.compile(
                  r'\s*<section className="chapter-page full-page-section" id="contact">.*?</section>',
                  re.S,
              )
              contact_overlay = """
              {contactOpen && (
                <div
                  className=\"contact-experience\"
                  id=\"contact\"
                  role=\"dialog\"
                  aria-modal=\"true\"
                  aria-labelledby=\"contact-experience-title\"
                >
                  <button
                    className=\"contact-experience-close\"
                    type=\"button\"
                    aria-label=\"Close Start a Project\"
                    onClick={() => {
                      setContactOpen(false)
                      setActiveNavigation(
                        contactReturnNavigation.current,
                      )

                      window.requestAnimationFrame(() => {
                        window.scrollTo({
                          top: contactReturnY.current,
                          behavior: 'auto',
                        })
                      })
                    }}
                  >
                    <span />
                    <span />
                  </button>

                  <div className=\"chapter-page-copy contact-experience-copy\">
                    <p>Contact</p>
                    <h2 id=\"contact-experience-title\">
                      Start something.
                    </h2>
                    <span>
                      A full-screen closing chapter built around the next project.
                    </span>
                  </div>
                </div>
              )}
              """
              app, count = contact_pattern.subn(
                  contact_overlay,
                  app,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('Contact section anchor not found')

          marker = '/* === START A PROJECT SCROLL EXPERIENCE === */'
          if marker not in css:
              css += r'''

          /* === START A PROJECT SCROLL EXPERIENCE === */
          .contact-experience {
            z-index: 11000;
            isolation: isolate;
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            min-height: 100svh;
            padding: 7rem var(--page-gutter) 3rem;
            color: var(--paper);
            background:
              radial-gradient(
                circle at 50% 42%,
                rgba(121, 74, 255, 0.14),
                transparent 34%
              ),
              #050505;
            overflow: hidden;
            animation:
              contactExperienceIn .72s
              cubic-bezier(.22, 1, .36, 1)
              both;
          }

          .contact-experience::before {
            content: '';
            z-index: -1;
            pointer-events: none;
            position: absolute;
            inset: 0;
            opacity: .16;
            background-image:
              linear-gradient(
                rgba(255,255,255,.035) 1px,
                transparent 1px
              ),
              linear-gradient(
                90deg,
                rgba(255,255,255,.035) 1px,
                transparent 1px
              );
            background-size: 56px 56px;
            mask-image:
              radial-gradient(
                circle,
                #000,
                transparent 72%
              );
          }

          .contact-experience-copy {
            width: min(78rem, 100%);
            text-align: center;
          }

          .contact-experience-close {
            z-index: 3;
            position: absolute;
            top: clamp(1.25rem, 3vw, 2.4rem);
            right: var(--page-gutter);
            width: 2.9rem;
            height: 2.9rem;
            padding: 0;
            cursor: pointer;
            color: #fff;
            background: rgba(5, 5, 8, .36);
            border: 1px solid rgba(255,255,255,.45);
            border-radius: 50%;
            backdrop-filter: blur(14px);
          }

          .contact-experience-close span {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1.15rem;
            height: 1px;
            background: currentColor;
          }

          .contact-experience-close span:first-child {
            transform: translate(-50%, -50%) rotate(45deg);
          }

          .contact-experience-close span:last-child {
            transform: translate(-50%, -50%) rotate(-45deg);
          }

          @keyframes contactExperienceIn {
            from {
              opacity: 0;
              transform: translateY(3vh) scale(.985);
              filter: blur(8px);
            }
            to {
              opacity: 1;
              transform: translateY(0) scale(1);
              filter: blur(0);
            }
          }

          @media (max-width: 820px) {
            .contact-experience {
              padding: 6rem 1.2rem 2rem;
            }
            .contact-experience-close {
              right: 1rem;
            }
          }

          @media (prefers-reduced-motion: reduce) {
            .contact-experience {
              animation: none;
            }
          }
          '''

          app_path.write_text(app)
          css_path.write_text(css)

          assert "const [contactOpen, setContactOpen] = useState(false)" in app
          assert "const openFromAboutEnd" in app
          assert 'className="contact-experience"' in app
          assert '<section className="chapter-page full-page-section" id="contact">' not in app
          assert "if (item === 'Contact')" in app
          assert marker in css
          print('Start a Project scroll experience applied')
          PY

      - name: Verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish and clean updater
        run: |
          git config user.name 'John Wolf'
          git config user.email '136143744+Johnwolf-connect@users.noreply.github.com'
          git add src/App.jsx src/styles.css
          git commit -m 'Trigger Start a Project after About scroll'
          git rm .github/workflows/add-start-project-scroll-trigger.yml
          git commit -m 'Clean Start a Project updater'
          git push origin main