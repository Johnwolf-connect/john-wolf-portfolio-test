name: Fix Screen Surface

on:
  push:
    paths:
      - '.github/workflows/fix-screen-surface.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore real MacBook display
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Verify production build
        run: |
          npm ci
          npm run build
      - name: Commit screen repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/start-project-transition-core.js
          git commit -m 'Restore MacBook display surface' || exit 0
          git push
