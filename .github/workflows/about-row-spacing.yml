name: Adjust About specialty rows

on:
  push:
    paths:
      - '.github/workflows/about-row-spacing.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update specialty row spacing and remove pill hover
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/styles.css')
          css = path.read_text()

          old_gap = ".specialties-marquees {\n  display: grid;\n  gap: clamp(0.9rem, 1.8vh, 1.35rem);\n  width: 100%;\n  margin-top: clamp(2.6rem, 6vh, 5rem);\n}"
          new_gap = ".specialties-marquees {\n  display: grid;\n  gap: clamp(1.55rem, 3.4vh, 2.5rem);\n  width: 100%;\n  margin-top: clamp(2.6rem, 6vh, 5rem);\n}"
          if old_gap not in css:
              raise SystemExit('Desktop specialties gap block not found')
          css = css.replace(old_gap, new_gap, 1)

          old_transition = "  transition: transform 220ms ease, border-color 220ms ease, background 220ms ease, box-shadow 220ms ease;\n}"
          new_transition = "  transition: none;\n}"
          if old_transition not in css:
              raise SystemExit('Specialty pill transition not found')
          css = css.replace(old_transition, new_transition, 1)

          hover_block = "\n.specialty-pill:hover {\n  z-index: 2;\n  transform: translateY(-2px) scale(1.035);\n  border-color: #fff;\n  background: rgba(255, 255, 255, 0.1);\n  box-shadow: 0 0 28px rgba(212, 96, 197, 0.16), 0 12px 34px rgba(0, 0, 0, 0.2);\n}\n"
          if hover_block not in css:
              raise SystemExit('Specialty pill hover block not found')
          css = css.replace(hover_block, "\n", 1)

          old_mobile = "  .specialties-marquees {\n    gap: 0.82rem;\n    margin-top: 2.2rem;\n  }"
          new_mobile = "  .specialties-marquees {\n    gap: 1.35rem;\n    margin-top: 2.2rem;\n  }"
          if old_mobile not in css:
              raise SystemExit('Mobile specialties gap block not found')
          css = css.replace(old_mobile, new_mobile, 1)

          path.write_text(css)
          print('About specialty spacing and hover update applied.')
          PY

      - name: Verify production build
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build

      - name: Publish and clean updater
        run: |
          rm -f .github/workflows/about-row-spacing.yml
          git config user.name 'johnwolf-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Space About specialty rows and remove hover effect'
          git push origin HEAD:main
