name: Replace MacBook transition model

on:
  push:
    paths:
      - '.github/workflows/replace-macbook-model.yml'

permissions:
  contents: write

jobs:
  replace-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download uploaded MacBook Ultra bundle
        run: |
          curl -L --fail --retry 3 -o /tmp/macbook-ultra.zip 'https://at.adobe.com/xjEBGMDUF8y3no7r'
          rm -rf /tmp/macbook-ultra
          mkdir -p /tmp/macbook-ultra
          unzip -q /tmp/macbook-ultra.zip -d /tmp/macbook-ultra

      - name: Replace current laptop model
        run: |
          source='/tmp/macbook-ultra/macbook-ultra-concept/source/MacBook Ultra.glb'
          target='public/assets/start-project/macbook/macbook-ultra.glb'
          test -s "$source"
          cp "$source" "$target"
          rm -f public/assets/start-project/macbook/macbook-pro-2020.obj

      - name: Commit model replacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/start-project/macbook/macbook-ultra.glb
          git add -u public/assets/start-project/macbook
          git diff --cached --quiet && exit 0
          git commit -m 'Replace Start a Project laptop with MacBook Ultra model'
          git push
