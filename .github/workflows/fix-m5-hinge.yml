name: Fix M5 hinge and screen side
on:
  push:
    paths:
      - '.github/scripts/fix_m5_hinge.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/fix_m5_hinge.py
      - run: npm ci
      - run: npm run build
      - name: Commit repaired transition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/start-project-transition-core.js
          git diff --cached --quiet || git commit -m "Fix M5 lid hinge and rear-screen projection"
          git push
