name: Update Services cards and contact button

on:
  push:
    paths:
      - '.github/workflows/update-services-cards-contact.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Services carousel and contact action
        run: python3 -c "import base64; exec(base64.b64decode(''))"

      - name: Verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish and clean updater
        run: |
          rm -f .github/workflows/update-services-cards-contact.yml
          git config user.name "John Wolf"
          git config user.email "136143744+Johnwolf-connect@users.noreply.github.com"
          git add src/App.jsx src/styles.css .github/workflows/update-services-cards-contact.yml
          git commit -m "Remove Home and Contact cards and add Services contact button"
          git push
