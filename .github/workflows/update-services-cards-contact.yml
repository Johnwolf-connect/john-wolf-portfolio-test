name: Update Services cards and contact button

on:
  push:
    paths:
      - '.github/workflows/update-services-cards-contact.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Services carousel and contact action
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.jsx')
          app = app_path.read_text()

          home_card = """  {
            title: 'Home',
            eyebrow: 'Opening scene',
            description: 'Return to the beginning of the experience.',
            video: '/assets/hero-neon.mp4',
            poster: '/assets/hero-neon-poster.png',
          },
          """

          contact_card = """  {
            title: 'Contact',
            eyebrow: 'Start something',
            description: 'Bring the idea. We will shape the visual experience around it.',
            video: '/assets/carousel/contact.mp4',
            poster: '/assets/carousel/contact.jpg',
          },
          """

          if home_card not in app:
              raise SystemExit('Home carousel card not found')
          if contact_card not in app:
              raise SystemExit('Contact carousel card not found')

          app = app.replace(home_card, '', 1)
          app = app.replace(contact_card, '', 1)

          old_heading = """            <div className=\"carousel-heading\">
              <p>Services</p>
              <h2>Move through the work.</h2>
            </div>
          """

          new_heading = """            <div className=\"carousel-heading\">
              <p>Services</p>
              <h2>Move through the work.</h2>
              <button
                className=\"services-contact-button\"
                type=\"button\"
                onClick={() =>
                  navigateToSection('Contact', true)
                }
              >
                Contact
                <span aria-hidden=\"true\">↗</span>
              </button>
            </div>
          """

          if old_heading not in app:
              raise SystemExit('Services heading block not found')

          app = app.replace(old_heading, new_heading, 1)
          app_path.write_text(app)

          css_path = Path('src/styles.css')
          css = css_path.read_text()
          marker = '/* ===== SERVICES CONTACT BUTTON ===== */'

          if marker not in css:
              css += """

/* ===== SERVICES CONTACT BUTTON ===== */
.services-contact-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.65rem;
  min-height: 3.05rem;
  margin-top: 1.65rem;
  padding: 0.78rem 1.2rem;
  border: 1px solid rgba(255, 255, 255, 0.58);
  border-radius: 0.72rem;
  background: rgba(255, 255, 255, 0.035);
  color: #fff;
  font: inherit;
  font-size: 0.82rem;
  font-weight: 680;
  cursor: pointer;
  pointer-events: auto;
  backdrop-filter: blur(12px);
  transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
}

.services-contact-button:hover {
  transform: translateY(-2px);
  border-color: rgba(255, 255, 255, 0.9);
  background: rgba(255, 255, 255, 0.09);
}

.services-contact-button span {
  font-size: 1rem;
  line-height: 1;
}

@media (max-width: 820px) {
  .services-contact-button {
    min-height: 2.7rem;
    margin-top: 1.1rem;
    padding: 0.66rem 1rem;
    font-size: 0.76rem;
  }
}
/* ===== SERVICES CONTACT BUTTON: END ===== */
"""
              css_path.write_text(css)
          PY

      - name: Verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish and clean updater
        run: |
          rm -f .github/workflows/update-services-cards-contact.yml
          git config user.name "John Wolf"
          git config user.email "136143744+Johnwolf-connect@users.noreply.github.com"
          git add src/App.jsx src/styles.css .github/workflows/update-services-cards-contact.yml
          git commit -m "Remove Home and Contact cards and add Services contact button"
          git push
