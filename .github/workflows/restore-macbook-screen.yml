name: Restore MacBook Screen
'on':
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-macbook-screen.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore display surface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/start-project-transition-core.js')
          s = p.read_text()
          old = '        screenPlane.visible = false\n        lidPivot.rotation.x = CLOSED_ANGLE'
          new = '''        const screenTexture = new THREE.TextureLoader().load('/assets/start-project/macbook/textures/home_screen_diff.jpg')
        screenTexture.colorSpace = THREE.SRGBColorSpace
        screenTexture.flipY = false
        screenPlane.material = new THREE.MeshBasicMaterial({ map: screenTexture, color: 0xffffff, toneMapped: false, side: THREE.DoubleSide })
        screenPlane.visible = true
        lidPivot.rotation.x = CLOSED_ANGLE'''
          if old not in s:
              raise SystemExit('Expected hidden-screen block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit
        run: |
          rm .github/workflows/restore-macbook-screen.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/start-project-transition-core.js .github/workflows/restore-macbook-screen.yml
          git commit -m 'Restore MacBook display surface with supplied screen texture'
          git push
