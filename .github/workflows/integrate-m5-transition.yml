name: Integrate M5 Transition
on:
  push:
    paths:
      - '.github/scripts/integrate_m5.py'
      - '.github/workflows/integrate-m5-transition.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Integrate M5 model
        run: python .github/scripts/integrate_m5.py
      - name: Verify production build
        run: npm ci && npm run build
      - name: Commit integration
        run: |
          git config user.name 'John Wolf'
          git config user.email '136143744+Johnwolf-connect@users.noreply.github.com'
          git add src/start-project-transition-core.js
          git diff --cached --quiet || git commit -m 'Integrate MacBook Pro 14-inch M5 transition'
          git push
