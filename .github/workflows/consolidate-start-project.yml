name: Consolidate Start Project System

on:
  push:
    branches: [start-project-system-repair]
    paths:
      - '.github/workflows/consolidate-start-project.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: start-project-system-repair
      - name: Consolidate transition into source
        run: |
          cp public/assets/start-project/start-project-transition-core.js src/start-project-transition-core.js
          cat > src/start-project-transition-entry.js <<'EOF'
          import * as THREE from 'three'
          import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
          import { initStartProjectTransition } from './start-project-transition-core.js'

          try {
            initStartProjectTransition({ THREE, GLTFLoader })
          } catch (error) {
            console.error('The Start a Project 3D transition could not initialize.', error)
          }
          EOF
          rm public/assets/start-project/start-project-transition-core.js
      - name: Make transition fail-safe and non-blocking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/start-project-transition-core.js')
          s=p.read_text()
          old="""    await modelReady

    if (modelLoadFailed || !modelLoaded) {
      animating = false
      console.error('Start a Project stopped because the MacBook model is unavailable.')
      return
    }

    resizeRenderer()
"""
          new="""    resizeRenderer()

    // Reveal the transition shell immediately. Model loading must never make
    // Start a Project appear dead; the environment/form remain usable while
    // the laptop finishes loading or if WebGL/model loading fails.
    const modelPromise = modelReady
"""
          if old not in s:
              raise SystemExit('openTransition model gate not found')
          s=s.replace(old,new,1)
          old2="""    laptopRoot.position.set(0, 0, 0)
    laptopRoot.rotation.set(0, 0, 0)
    laptopRoot.scale.setScalar(layout.initialScale)
    lidOpenProgress = 0
    if (lidPivot) lidPivot.rotation.x = CLOSED_LID_ANGLE

    cancelAnimationFrame(animationFrame)
    animationFrame = requestAnimationFrame(renderFrame)

    await animate(2860, (progress) => {
      setOpeningPose(progress)
    })
"""
          new2="""    laptopRoot.position.set(0, 0, 0)
    laptopRoot.rotation.set(0, 0, 0)
    laptopRoot.scale.setScalar(layout.initialScale)
    lidOpenProgress = 0
    if (lidPivot) lidPivot.rotation.x = CLOSED_LID_ANGLE

    cancelAnimationFrame(animationFrame)
    animationFrame = requestAnimationFrame(renderFrame)

    await modelPromise
    if (modelLoadFailed || !modelLoaded) {
      console.error('MacBook model unavailable; keeping Start a Project shell active.')
      stage.classList.add('is-rock-visible', 'is-form-visible', 'is-settled')
      settled = false
      animating = false
      return
    }

    await animate(2860, (progress) => {
      setOpeningPose(progress)
    })
"""
          if old2 not in s:
              raise SystemExit('animation block not found')
          s=s.replace(old2,new2,1)

          # Do not hijack ordinary Contact links. Only Start a Project triggers
          # this cinematic system; Contact keeps its native React navigation.
          s=s.replace("'.header-cta, a[href=\"#contact\"], a[href=\"/#contact\"]'", "'.header-cta, [data-start-project-trigger]'")
          s=s.replace("""    const opensContact =
      /^contact$/i.test(label)

    if (!startsProject && !opensContact) return
""", """    if (!startsProject) return
""")
          p.write_text(s)
          PY
      - name: Verify no duplicate core remains
        run: |
          test -f src/start-project-transition-core.js
          test ! -f public/assets/start-project/start-project-transition-core.js
          grep -q "macbook-pro-2020.glb" src/start-project-transition-core.js
          grep -q "import { initStartProjectTransition } from './start-project-transition-core.js'" src/start-project-transition-entry.js
          ! grep -q "macbook-ultra.glb" src/start-project-transition-core.js
      - name: Syntax and production build
        run: |
          node --check src/start-project-transition-core.js
          npm ci
          npm run build
      - name: Commit repair to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/start-project-transition-core.js src/start-project-transition-entry.js public/assets/start-project/start-project-transition-core.js
          git commit -m 'Consolidate and fail-safe Start Project transition' || exit 0
          git push origin HEAD:start-project-system-repair
