name: Remove Old MacBook Cleanly

on:
  push:
    paths:
      - '.github/workflows/remove-old-macbook-clean.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove all old MacBook-specific code
        run: |
          echo '' | base64 -d > /tmp/remove_old_macbook.py
          python3 /tmp/remove_old_macbook.py
      - name: Verify JavaScript syntax
        run: node --check public/assets/start-project/start-project-transition-core.js
      - name: Verify production build
        run: |
          npm install
          npm run build
      - name: Publish cleanup
        run: |
          rm -f .github/workflows/remove-old-macbook-clean.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/start-project/start-project-transition-core.js .github/workflows/remove-old-macbook-clean.yml
          git commit -m 'Remove old MacBook model integration completely'
          git push
