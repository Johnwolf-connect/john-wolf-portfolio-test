name: Apply Neue Haas heading CSS

on:
  push:
    paths:
      - '.github/workflows/apply-neue-haas-css.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply heading typography
        run: |
          if ! grep -q 'NEUE HAAS DISPLAY HEADINGS: START' src/styles.css; then
            printf '%s' '' | base64 --decode >> src/styles.css
          fi

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Publish and clean updater
        run: |
          rm -f .github/workflows/apply-neue-haas-css.yml
          git config user.name 'John Wolf'
          git config user.email '136143744+Johnwolf-connect@users.noreply.github.com'
          git add src/styles.css .github/workflows/apply-neue-haas-css.yml
          git commit -m 'Apply Neue Haas display typography'
          git push
