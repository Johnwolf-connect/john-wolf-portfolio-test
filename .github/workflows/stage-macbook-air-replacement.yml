name: Stage MacBook Air replacement

on:
  push:
    branches:
      - macbook-air-replacement
    paths:
      - '.github/workflows/stage-macbook-air-replacement.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macbook-air-replacement

      - name: Download exact uploaded MacBook Air GLB
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://at.adobe.com/boMb7sOUVqjCi8Ba' \
            -o /tmp/macbook-air.glb
          test "$(stat -c %s /tmp/macbook-air.glb)" = "9614728"
          echo '235295da6eaa81f55d4a7c895c152171a59bcc560c746390a65d8f2e503bf875  /tmp/macbook-air.glb' | sha256sum -c -

      - name: Replace existing laptop asset in place
        run: |
          set -euo pipefail
          cp /tmp/macbook-air.glb public/assets/start-project/macbook/macbook-ultra.glb
          test "$(stat -c %s public/assets/start-project/macbook/macbook-ultra.glb)" = "9614728"
          echo '235295da6eaa81f55d4a7c895c152171a59bcc560c746390a65d8f2e503bf875  public/assets/start-project/macbook/macbook-ultra.glb' | sha256sum -c -

      - name: Verify site build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit exact replacement and clean staging workflow
        run: |
          set -euo pipefail
          git config user.name 'John Wolf'
          git config user.email '136143744+Johnwolf-connect@users.noreply.github.com'
          git add public/assets/start-project/macbook/macbook-ultra.glb
          git commit -m 'Replace Start Project laptop with 2023 MacBook Air'
          git rm -f .github/workflows/stage-macbook-air-replacement.yml
          git commit -m 'Clean MacBook Air staging workflow'
          git push origin macbook-air-replacement
