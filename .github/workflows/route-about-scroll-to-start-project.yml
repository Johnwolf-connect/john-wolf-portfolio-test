name: Route About scroll to Start Project

on:
  push:
    paths:
      - '.github/workflows/route-about-scroll-to-start-project.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Route Section 3 scroll into existing Start a Project transition
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          app = path.read_text()

          old = """    triggerLocked = true
    contactReturnY.current = window.scrollY
    contactReturnNavigation.current = 'About'
    setActiveNavigation('Contact')
    setContactOpen(true)

    window.setTimeout(() => {
      triggerLocked = false
    }, 650)
"""

          new = """    triggerLocked = true
    setActiveNavigation('Contact')

    const startProject =
      window.__johnWolfStartProjectTransition

    if (startProject?.open) {
      startProject.open()
    }

    window.setTimeout(() => {
      triggerLocked = false
    }, 650)
"""

          if old not in app:
              raise SystemExit('About-end Start a Project trigger block not found')

          app = app.replace(old, new, 1)
          path.write_text(app)

          assert 'window.__johnWolfStartProjectTransition' in app
          assert 'startProject.open()' in app
          print('About-end scroll now opens the existing Start a Project transition')
          PY

      - name: Verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish and clean updater
        run: |
          git config user.name 'John Wolf'
          git config user.email '136143744+Johnwolf-connect@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'Route About scroll to existing Start a Project transition'
          git rm -f .github/workflows/route-about-scroll-to-start-project.yml
          git commit -m 'Clean Start Project routing updater'
          git push origin main
